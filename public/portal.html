<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal | Sistemas Psicologicos</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="public-body">
    <div id="alert" class="alert hidden" aria-live="polite"></div>
    <main class="public-shell">
      <header class="brand-nav">
        <a class="brand-lockup" href="/portal.html">
          <span>
            <strong>Sistemas Psicologicos</strong>
            <small>Portal del participante</small>
          </span>
        </a>
        <button id="logoutButton" class="secondary-button" type="button">Salir</button>
      </header>

      <section class="glass-card screen-card portal-dashboard">
        <div class="portal-hero">
          <div class="section-heading">
            <span class="eyebrow">Bienvenido</span>
            <h1 id="welcomeName">Participante</h1>
            <p id="welcomeMeta">Evaluaciones asignadas</p>
          </div>
          <aside class="session-panel" aria-label="Sesion actual">
            <span class="question-category">Sesion actual</span>
            <strong id="sessionUsername">-</strong>
            <small id="sessionRole">Participante</small>
          </aside>
        </div>

        <div id="profileSummary" class="profile-summary" aria-label="Perfil militar"></div>
        <div class="progress-panel portal-progress">
          <div class="progress-meta">
            <p id="overallProgressLabel">Avance general</p>
            <p id="overallProgressMessage" class="progress-message">Cargando evaluaciones asignadas...</p>
          </div>
          <div class="progress-bar" aria-hidden="true">
            <div id="overallProgressFill" class="progress-fill"></div>
          </div>
        </div>

        <div class="section-heading compact portal-section-heading">
          <span class="step-pill">Evaluaciones</span>
          <h2>Tu ruta psicologica</h2>
          <p>Inicia o continua cada instrumento desde aqui. El avance se guarda en el sistema.</p>
        </div>
        <div id="assignmentList" class="instrument-grid"></div>
      </section>
    </main>
    <script src="/portal.js"></script>
  </body>
</html>
